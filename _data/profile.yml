about:
  - I am a software engineer at LinkedIn with over 7 years of experience in distributed systems and service infrastructure.
  - I am part of the traffic team, building highly available, scalable and secure services that serve as the front door for all of LinkedIn. My work focuses on low-latency microservices, smart load balancing, rate limiting, and foundational gateway features for systems processing over 2 million requests per second.
  - Beyond technical delivery, I bring cross-functional collaboration, strong communication, a passion for learning new technologies, and a commitment to building a positive team culture.

